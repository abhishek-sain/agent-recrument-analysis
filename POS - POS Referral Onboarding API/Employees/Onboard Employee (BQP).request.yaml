$kind: http-request
description: BQP Employee onboarding - no link generation. Creates the users_data row directly (user_type=EMPLOYEE, status=FORM_IN_PROGRESS) and returns a token - use it against the same PUT .../onboarding/{token}/form, POST .../onboarding/{token}/documents, and POST .../onboarding/{token}/submit endpoints as the POS/Referral flow.
url: "{{base_url}}/api/v1/employees/onboard"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Priya Sharma",
      "number": "9812345670",
      "email": "priya@example.com",
      "raised_by": "EMP001"
    }
scripts:
  - type: afterResponse
    code: |-
      const data = pm.response.json();
      pm.collectionVariables.set('token', data.token);
      pm.collectionVariables.set('record_id', data.id);
      pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
