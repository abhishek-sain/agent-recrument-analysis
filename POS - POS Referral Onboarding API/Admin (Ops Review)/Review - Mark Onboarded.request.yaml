$kind: http-request
description: UNDER_TRAINING -> ONBOARDED. Stamps joining_date the first time this happens (feeds the Ageing Report). This also unlocks POS Referral -> POS conversion.
url: "{{base_url}}/api/v1/admin/onboarding/{{record_id}}/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "next_status": "ONBOARDED",
      "reviewed_by": "OPS01"
    }
order: 2200
