$kind: http-request
description: Manually promotes an onboarded POS Referral to a full POS. Only works when user_type=POS_REFERRAL and status=ONBOARDED. Stamps pos_conversion_date, which feeds the Ageing Report.
url: "{{base_url}}/api/v1/admin/onboarding/{{record_id}}/convert-to-pos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "converted_by": "OPS01"
    }
order: 5000
