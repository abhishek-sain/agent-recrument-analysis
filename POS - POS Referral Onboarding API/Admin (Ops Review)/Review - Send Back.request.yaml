$kind: http-request
description: Only legal from UNDER_REVIEW. Rotates the onboarding token/link and re-opens the form for corrections; returns a fresh new_onboarding_url to resend.
url: "{{base_url}}/api/v1/admin/onboarding/{{record_id}}/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "next_status": "SEND_BACK",
      "reviewed_by": "OPS01"
    }
scripts:
  - type: afterResponse
    code: |-
      const data = pm.response.json();
      if (data.new_onboarding_url) { console.log('New link issued:', data.new_onboarding_url); }
    language: text/javascript
order: 2600
